<!doctype html><html><head><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Inter:wght@400;600&amp;family=Noto+Sans+Telugu:wght@400;600&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5300}a:hover{color:#5E3900}
</style>
</head><body>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FAF7F2; color: #1B1A17; font-family: 'Inter', 'Noto Sans Telugu', 'Noto Sans Devanagari', sans-serif">
  <header style="height: 68px; background: #0B0B0B; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; border-bottom: 1px solid rgba(214,168,62,0.35)">
    <span style="width: 52px; height: 46px; overflow: hidden; display: block"><img src="logo.jpg" alt="" style="width: 52px; height: auto; display: block"></span>
    <span style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 16px; letter-spacing: 0.05em; color: #E4B24C; flex-grow: 1; line-height: 24px">Saaradhi Go</span>
    <button aria-label="Menu" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A3A3A; background: transparent; color: #F3EEE6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>
  <form style="padding: 18px 20px; display: flex; flex-direction: column; gap: 11px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Create your account</h1></div>
    <div style="font-size: 14px; color: #57524A; margin-top: -6px; line-height: 20px">Have one? <a href="#" style="font-weight: 600">Log in</a></div>
    <div role="group" aria-label="Sign up with" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 12px; background: #F3EEE6">
      <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; line-height: 24px">Email</button>
      <button type="button" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #57524A; font: inherit; font-size: 16px; font-weight: 600; line-height: 24px">Mobile</button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; line-height: 20px">Full name<input style="height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #8C8579; background: #FFFFFF; font: inherit; font-size: 16px; line-height: 24px"></label>
    <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; line-height: 20px">Email<input type="email" style="height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #8C8579; background: #FFFFFF; font: inherit; font-size: 16px; line-height: 24px"></label>
    <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; line-height: 20px">Mobile number · we text a code
      <span style="display: flex; height: 48px; border-radius: 10px; border: 1px solid #8C8579; overflow: hidden; background: #FFFFFF"><select aria-label="Country code" style="border: 0; border-right: 1px solid #E7E1D7; background: #F3EEE6; font: inherit; font-size: 16px; padding: 0 8px; line-height: 24px"><option>+91</option></select><input inputmode="numeric" style="flex-grow: 1; border: 0; padding: 0 12px; font: inherit; font-size: 16px; min-width: 0; line-height: 24px"></span>
    </label>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; line-height: 20px">Password<input type="password" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8C8579; background: #FFFFFF; font: inherit; font-size: 16px; min-width: 0; line-height: 24px"></label>
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; line-height: 20px">Confirm<input type="password" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8C8579; background: #FFFFFF; font: inherit; font-size: 16px; min-width: 0; line-height: 24px"></label>
    </div>
    <div style="font-size: 14px; color: #57524A; margin-top: -4px; line-height: 20px">At least 10 characters.</div>
    <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #F5A623; color: #1B1A17; font: inherit; font-size: 16px; font-weight: 600; line-height: 24px">Create account</button>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #57524A">By creating an account you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
  </form>
</div>
</body></html>
