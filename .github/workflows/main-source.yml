# main takes pull requests from develop only (owner, 11 Nov): develop deploys to QA, main to production.
# A required check on main; it fails any other source branch.
name: main source
on:
  pull_request:
    branches: [main]
jobs:
  source-branch:
    name: source branch
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "main takes pull requests from develop only, not $HEAD_REF"; exit 1
          fi
