# Lint, type-check and build the operations console.
#
# This repository had no CI at all. The cost of that was concrete: the Drivers
# page -- the screen an operator uses to see and approve drivers -- called
# `/driver/admin/list/`, which does not exist and answers 404 on the deployed
# backend. The page showed "Could not load drivers" and nothing else. A build is
# not enough to catch that one, but a repository with no CI is a repository where
# nobody finds out, and there were no tests either.
#
# Three gates, all verified to pass locally before this workflow was added:
#   lint        eslint . --ext .ts,.tsx --max-warnings 0
#   type-check  tsc --noEmit
#   build       next build
#
# `next lint` is deliberately NOT used. It is deprecated in Next 15 and, with no
# ESLint config present, it PROMPTS for one -- which hangs a runner rather than
# failing it. The ESLint CLI is non-interactive.
#
# No secrets are needed. NEXT_PUBLIC_API_BASE_URL has a localhost default in
# lib/api.ts, and nothing here talks to a real backend.
name: ops-console

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ops-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the commits this run introduces
        # Only NEW commits are scanned; the full history was scanned once by
        # hand and recorded (internal docs, AUDIT.md section 24.3).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2             git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE"             --redact --no-banner --exit-code 1

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 15.5 supports 18.18+. 22 because the unit tests run TypeScript
          # through Node's own type stripping (--experimental-strip-types),
          # which 20 does not have.
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` rather than `npm install`, so the lockfile is authoritative and a
      # CI run cannot silently resolve different versions than a developer has.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # node:test, no framework. Today: the environment badge must fail
      # towards PRODUCTION when it cannot tell where it is.
      - name: Unit tests
        run: npm test

      # The browser requests /favicon.ico whether or not anything links to it.
      # Nothing imports these files, so only a browser (or this step) notices
      # when one goes missing.
      - name: Icon assets
        run: npm run check-icons

      # The design system's tokens.css is the only file allowed to hold a
      # colour. Nothing in a lint or a type-check notices a hex literal, which
      # is how this app ended up with two palettes that had drifted apart.
      - name: Design tokens
        run: npm run check-tokens

      # Every stylesheet must parse; every `var(--x)` must name a token
      # that exists; tokens.css may declare custom properties only on the
      # theme roots; the light theme must define everything the dark one
      # does. A missing brace once put the whole console ramp inside
      # `.fare { }` and nothing noticed -- the browser just ignored it.
      - name: CSS validity and tokens
        run: npm run check-css

      - name: Build
        run: npm run build

      # The sign-in preview strip is compiled out of every build that does
      # not set NEXT_PUBLIC_CONSOLE_PREVIEW=true; CI builds without it, so
      # the output must contain no trace of it.
      - name: No preview code in the production bundle
        run: npm run check-no-preview
